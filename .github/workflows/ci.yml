name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ────────────────────────────────────────────────
  # Job 1 : Backend — build, tests, couverture
  # ────────────────────────────────────────────────
  build-and-test:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chrono_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: krono_backend/package-lock.json

      - name: Install dependencies
        working-directory: ./krono_backend
        run: npm ci

      - name: Build TypeScript
        working-directory: ./krono_backend
        run: npm run build

      - name: Run tests with coverage
        working-directory: ./krono_backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/chrono_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/chrono_test
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-testing
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          LOG_LEVEL: error
        run: npm run test:ci

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: krono_backend/coverage/
          retention-days: 7

  # ────────────────────────────────────────────────
  # Job 2 : Sécurité backend (audit obligatoire)
  # ────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: krono_backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./krono_backend
        run: npm ci

      - name: npm audit backend (échoue sur high/critical)
        working-directory: ./krono_backend
        run: npm audit --audit-level=high

      - name: TruffleHog — détection de secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified

  # ────────────────────────────────────────────────
  # Job 3 : TypeScript backend
  # ────────────────────────────────────────────────
  lint-and-type-check:
    name: Backend — Lint & TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: krono_backend/package-lock.json

      - name: Install dependencies
        working-directory: ./krono_backend
        run: npm ci

      - name: TypeScript type check
        working-directory: ./krono_backend
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────
  # Job 4 : Admin (Next.js) — lint + tsc + build stricts
  # ────────────────────────────────────────────────
  admin-build:
    name: Admin — Lint, TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin_krono/package-lock.json

      - name: Install dependencies
        working-directory: ./admin_krono
        run: npm ci

      - name: Lint
        working-directory: ./admin_krono
        run: npm run lint

      - name: TypeScript type check
        working-directory: ./admin_krono
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./admin_krono
        env:
          NEXT_PUBLIC_API_URL: https://api.krono-ci.test
          NEXT_PUBLIC_SOCKET_URL: wss://api.krono-ci.test
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      - name: npm audit admin (informationnel — jsPDF et xlsx sans fix disponible)
        working-directory: ./admin_krono
        run: npm audit --audit-level=critical || true

  # ────────────────────────────────────────────────
  # Job 5 : Apps Expo — lint obligatoire
  # ────────────────────────────────────────────────
  expo-lint:
    name: Expo — Lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [app_krono, driver_krono]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Lint
        working-directory: ./${{ matrix.project }}
        run: npm run lint

  # ────────────────────────────────────────────────
  # Job 6 : Déploiement backend (Render) — seulement si tout est vert
  # ────────────────────────────────────────────────
  # Prérequis (à faire une seule fois, manuellement) :
  #   1. Dans Render : Settings > Deploy Hook > copier l'URL, puis désactiver
  #      "Auto-Deploy" sur le service (sinon Render déploie aussi tout seul,
  #      sans attendre le résultat de cette CI).
  #   2. Dans GitHub : Settings > Secrets and variables > Actions > New repository
  #      secret > nom RENDER_DEPLOY_HOOK_URL, coller l'URL copiée à l'étape 1.
  deploy-backend:
    name: Déploiement — Backend (Render)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test, security-scan, lint-and-type-check]
    steps:
      - name: Déclencher le déploiement Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL non configuré — déploiement backend ignoré. Voir commentaire du job pour la config."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ────────────────────────────────────────────────
  # Job 7 : Déploiement admin (Vercel) — seulement si tout est vert
  # ────────────────────────────────────────────────
  # Prérequis (à faire une seule fois, manuellement) :
  #   1. Dans Vercel : Project Settings > Git > désactiver le déploiement
  #      automatique sur push pour la branche main (sinon Vercel déploie
  #      aussi tout seul, sans attendre le résultat de cette CI).
  #   2. Dans Vercel : Project Settings > Git > Deploy Hooks > créer un hook
  #      sur la branche main, copier l'URL.
  #   3. Dans GitHub : Settings > Secrets and variables > Actions > New repository
  #      secret > nom VERCEL_DEPLOY_HOOK_URL, coller l'URL copiée à l'étape 2.
  deploy-admin:
    name: Déploiement — Admin (Vercel)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [admin-build]
    steps:
      - name: Déclencher le déploiement Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL non configuré — déploiement admin ignoré. Voir commentaire du job pour la config."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
